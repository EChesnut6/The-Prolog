<div class="ebert-container">
  <header class="collection-header">
    <a href="index.html" class="back-link" style="color: var(--accent); font-family: var(--sans); font-weight: 700; text-transform: uppercase; font-size: 0.85rem; text-decoration: none; display: inline-block; margin-bottom: 16px;">← Back to Collections</a>
    <h1>{{ collection.title }}</h1>
    <p class="lead">{{ collection.teaser }}</p>
    <div class="collection-overview" style="color: var(--text-muted); line-height: 1.8; font-size: 1.05rem;">
      {{ collection.overview | safe }}
    </div>
  </header>

  <section class="collection-movies-grid">
    {% for item in movie_cards %}
    <article class="collection-movie-card">
      <a href="../reviews/{{ item.movie.slug }}.html">
        <div class="collection-movie-card__poster-wrapper">
          <img class="collection-movie-card__poster" src="{{ item.poster_url }}" alt="{{ item.movie.title }} poster">
        </div>
        <div class="collection-movie-card__content">
          <h3>{{ item.movie.title }}</h3>
          <p class="movie-meta">{{ item.movie.year }} · {{ item.director }}</p>
          {% if item.tagline %}
          <p class="tagline"><em>"{{ item.tagline }}"</em></p>
          {% endif %}
        </div>
      </a>
    </article>
    {% endfor %}
  </section>
</div>
