<div class="search-page-container">
  <header class="search-header">
    <p class="eyebrow">Database Search</p>
    <h1>Find a Movie</h1>
    <div class="dedicated-search-bar">
      <input id="dedicated-movie-search" type="search" placeholder="Search by title or director..." autocomplete="off" autofocus>
      <div class="search-icon">
        <svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="9" r="6"></circle>
          <line x1="14" y1="14" x2="18" y2="18"></line>
        </svg>
      </div>
    </div>
    <p id="dedicated-search-status" class="search-status" aria-live="polite">Showing all movies</p>
  </header>

  <section class="search-results-section">
    <div class="results-grid" id="dedicated-results-grid">
      <!-- Results will be injected here -->
    </div>
    <div id="pagination-controls" class="pagination-controls">
      <!-- Pagination buttons will be injected here -->
    </div>
  </section>
</div>

<style>
.search-page-container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 60px 24px;
}

.search-header {
  text-align: center;
  margin-bottom: 60px;
}

.search-header h1 {
  font-family: var(--serif);
  font-size: 3.5rem;
  margin: 10px 0 30px;
}

.dedicated-search-bar {
  position: relative;
  max-width: 600px;
  margin: 0 auto;
}

.dedicated-search-bar input {
  width: 100%;
  padding: 18px 24px 18px 56px;
  font-size: 1.2rem;
  border: 2px solid var(--line);
  border-radius: 50px;
  background: var(--card-bg);
  color: var(--text);
  transition: border-color 0.3s, box-shadow 0.3s;
}

.dedicated-search-bar input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-ring);
}

.dedicated-search-bar .search-icon {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
}

.search-status {
  margin-top: 20px;
  font-size: 0.9rem;
  color: var(--text-muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 32px;
  min-height: 400px;
}

.search-page-container .mini-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.search-page-container .mini-card:hover {
    transform: translateY(-8px);
}

/* Pagination Styles */
.pagination-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 64px;
  padding-top: 32px;
  border-top: 1px solid var(--line);
}

.page-button {
  padding: 10px 18px;
  border: 1px solid var(--line);
  background: var(--card-bg);
  color: var(--text);
  border-radius: 6px;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.9rem;
  transition: all 0.2s;
}

.page-button:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--panel);
}

.page-button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}

.page-button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.page-info {
  font-size: 0.9rem;
  color: var(--text-muted);
  font-weight: 600;
}
</style>

<script>
  const searchInput = document.querySelector("#dedicated-movie-search");
  const resultsGrid = document.querySelector("#dedicated-results-grid");
  const statusText = document.querySelector("#dedicated-search-status");
  const paginationControls = document.querySelector("#pagination-controls");

  const movies = [
    {% for card in movie_cards %}
    {
      title: "{{ card.movie.title }}",
      slug: "{{ card.movie.slug }}",
      year: "{{ card.movie.year }}",
      director: "{{ card.director }}",
      poster: "{{ card.poster_url }}",
      keywords: "{{ card.search_keywords }}",
      reviewed: {{ 'true' if card.movie.reviewed else 'false' }}
    },
    {% endfor %}
  ];

  let currentPage = 1;
  const pageSize = 40;
  let currentMatches = [...movies];

  function renderPagination(totalItems) {
    const totalPages = Math.ceil(totalItems / pageSize);
    if (totalPages <= 1) {
      paginationControls.innerHTML = "";
      return;
    }

    let html = `
      <button class="page-button" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">Previous</button>
      <span class="page-info">Page ${currentPage} of ${totalPages}</span>
      <button class="page-button" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">Next</button>
    `;
    
    paginationControls.innerHTML = html;
  }

  window.goToPage = function(page) {
    currentPage = page;
    renderResults(currentMatches, false);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function renderResults(matches, resetPagination = true) {
    if (resetPagination) {
      currentPage = 1;
      currentMatches = matches;
    }

    if (matches.length === 0) {
      resultsGrid.innerHTML = '<div class="no-results">No movies found matching your search.</div>';
      statusText.textContent = "No results found";
      paginationControls.innerHTML = "";
      return;
    }

    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;
    const pageItems = matches.slice(start, end);

    resultsGrid.innerHTML = pageItems.map(m => `
      <article class="mini-card">
        <a href="reviews/${m.slug}.html">
          <img src="${m.poster}" alt="${m.title} poster">
          <div class="mini-card__copy">
            <h3>
              ${m.title}
              ${m.reviewed ? '<span class="review-icon" title="Reviewed">★</span>' : ''}
            </h3>
            <p class="mini-card__meta">${m.year} · ${m.director}</p>
          </div>
        </a>
      </article>
    `).join("");
    
    statusText.textContent = `${matches.length} movie${matches.length === 1 ? "" : "s"} found`;
    renderPagination(matches.length);
  }

  function performSearch() {
    const query = searchInput.value.trim().toLowerCase();
    
    if (!query) {
      renderResults(movies);
      statusText.textContent = "Showing all movies";
      return;
    }

    // Filter by Title first, then Director as requested
    const titleMatches = movies.filter(m => m.title.toLowerCase().includes(query));
    const directorMatches = movies.filter(m => 
      !titleMatches.includes(m) && m.director.toLowerCase().includes(query)
    );

    renderResults([...titleMatches, ...directorMatches]);
  }

  searchInput.addEventListener("input", performSearch);
  
  // Initial render
  renderResults(movies);
</script>
